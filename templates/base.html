<!DOCTYPE html>

<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet"href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-body">
	<nav class="topbar" aria-label="Top navigation">
		<div class="topbar-left">
			<a class="brand" href="{{ url_for('all_my_cards') }}">
				<span class="brand-name">
					/My-<span>H-Om</span>
				</span>
			</a>
			<a class="brand" href="{{ url_for('logout') }}">
				<span class="brand-name">
					<span>/Logout</span>
				</span>
			</a>
		</div>
		<div class="topbar-right">
			{% if session.get("user_id") %}
				<div class="topbar-user">
					<a href="{{ url_for('user_info') }}">
						<span class="user-dot"></span>
						<span>{{ session.get("user", "Student") }}</span>
					</a>
				</div>
			{% else %} 
				<a class="topbar-login" href="{{ url_for('login') }}">
					Log in</a>
			{% endif %}
		</div>
	</nav>

	<main class="main" id="main-content">
		{% block content %}
		{% endblock %}
	</main>
	
	<script src="{{ url_for('static', filename='js/cards.js') }}"></script>

</body>
</html>
